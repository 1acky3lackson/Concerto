plugins {
    id 'java-library'
}

group = project.maven_group
version = project.mod_version

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    api 'com.google.zxing:core:3.3.0'
    api('com.googlecode.soundlibs:mp3spi:1.9.5.4') {
        exclude group: 'com.googlecode.soundlibs', module: 'tritonus-share'
    }
    api 'com.github.GregTaoo:JustFLAC:85f0934435'
    api 'com.github.trilarion:vorbis-support:1.1.0'
    api('com.googlecode.soundlibs:tritonus-all:0.3.7.2') {
        exclude group: 'com.googlecode.soundlibs', module: 'tritonus-share'
    }
    api 'net.jthink:jaudiotagger:3.0.1'
    api 'com.google.code.gson:gson:2.10.1'
    api 'org.slf4j:slf4j-api:2.0.7'
    api 'org.apache.commons:commons-lang3:3.12.0'
    api 'org.jetbrains:annotations:24.0.0'
}
